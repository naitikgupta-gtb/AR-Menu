<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>4D AR Table Model Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: transparent !important;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewer-container {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent !important;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent !important;
      background-color: transparent !important;
      --poster-color: transparent;
      outline: none;
    }
    /* Floating Holographic AR Nutrition Callout Cards (Video 4) */
    .hotspot-card {
      background: rgba(18, 14, 12, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(212, 175, 55, 0.85);
      border-radius: 10px;
      padding: 6px 10px;
      color: #F7F2EB;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.75), 0 0 10px rgba(212, 175, 55, 0.25);
      pointer-events: auto;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
      white-space: nowrap;
      animation: floatPulse 3s ease-in-out infinite alternate;
    }
    .hotspot-card:hover, .hotspot-card.expanded {
      transform: translate(-50%, -105%) scale(1.06);
      border-color: #10B981;
      box-shadow: 0 6px 22px rgba(0, 0, 0, 0.85), 0 0 14px rgba(16, 185, 129, 0.4);
    }
    .hotspot-card::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #D4AF37;
      box-shadow: 0 0 8px #D4AF37;
    }
    .hotspot-card.expanded::after {
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
    }
    .hotspot-title {
      font-size: 11px;
      font-weight: 700;
      color: #D4AF37;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .hotspot-benefit {
      font-size: 9.5px;
      color: #10B981;
      font-weight: 600;
      margin-top: 1px;
    }
    @keyframes floatPulse {
      from { transform: translate(-50%, -100%) translateY(0); }
      to { transform: translate(-50%, -100%) translateY(-6px); }
    }
    /* Loading Indicator */
    #loading-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(212, 175, 55, 0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Google <model-viewer> engine -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js">
  </script>
</head>
<body>
  <div id="viewer-container">
    <model-viewer
      id="table-dish-viewer"
      src="models/pizza.glb"
      alt="3D Dish Model on Dining Table"
      camera-controls
      touch-action="pan-y"
      auto-rotate
      rotation-per-second="22deg"
      shadow-intensity="1.6"
      shadow-softness="0.75"
      exposure="1.15"
      environment-image="neutral"
      interaction-prompt="none"
      camera-orbit="15deg 62deg 110%"
      field-of-view="32deg"
      loading="eager">

      <!-- Dynamic Hotspots for Holographic AR Nutrition Cards -->
      <div id="hotspots-container"></div>
    </model-viewer>

    <div id="loading-overlay">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    const viewer = document.getElementById('table-dish-viewer');
    const hotspotsContainer = document.getElementById('hotspots-container');
    const loadingOverlay = document.getElementById('loading-overlay');

    let currentHotspots = [];
    let hotspotsVisible = true;

    viewer.addEventListener('load', () => {
      loadingOverlay.style.display = 'none';
      renderHotspots();
    });

    viewer.addEventListener('error', (err) => {
      console.warn("Model viewer load error:", err);
      loadingOverlay.style.display = 'none';
    });

    function setDishModel(modelSrc, hotspotsJson, trueScale) {
      loadingOverlay.style.display = 'flex';
      viewer.src = modelSrc;

      if (trueScale) {
        viewer.setAttribute('camera-orbit', '15deg 60deg 100%');
      } else {
        viewer.setAttribute('camera-orbit', '15deg 62deg 115%');
      }

      try {
        currentHotspots = JSON.parse(hotspotsJson || '[]');
      } catch (e) {
        currentHotspots = [];
      }
      renderHotspots();
    }

    function renderHotspots() {
      // Clear previous hotspots
      while (hotspotsContainer.firstChild) {
        hotspotsContainer.removeChild(hotspotsContainer.firstChild);
      }
      if (!hotspotsVisible || !currentHotspots.length) return;

      currentHotspots.forEach((hs, idx) => {
        const slotName = 'hotspot-' + idx;
        const btn = document.createElement('button');
        btn.slot = slotName;
        btn.className = 'hotspot-card';
        btn.setAttribute('data-position', hs.position || '0 0.05 0');
        btn.setAttribute('data-normal', '0 1 0');

        btn.innerHTML = `
          <div class="hotspot-title"><span>${hs.emoji || '✨'}</span> ${hs.name}</div>
          <div class="hotspot-benefit">${hs.benefit1}</div>
        `;

        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          btn.classList.toggle('expanded');
        });

        hotspotsContainer.appendChild(btn);
      });
    }

    function toggleAutoRotate(enabled) {
      if (enabled) {
        viewer.setAttribute('auto-rotate', '');
      } else {
        viewer.removeAttribute('auto-rotate');
      }
    }

    function toggleHotspots(enabled) {
      hotspotsVisible = enabled;
      renderHotspots();
    }

    function setExposure(val) {
      viewer.exposure = parseFloat(val) || 1.1;
    }

    function setScale1To1(is1To1) {
      if (is1To1) {
        viewer.cameraOrbit = '15deg 58deg 95%';
      } else {
        viewer.cameraOrbit = '15deg 62deg 115%';
      }
    }

    window.ArTableBridge = {
      setDishModel,
      toggleAutoRotate,
      toggleHotspots,
      setExposure,
      setScale1To1
    };
  </script>
</body>
</html>
